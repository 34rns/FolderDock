name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Core checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Regression tests
        shell: pwsh
        run: |
          $testFiles = @(Get-ChildItem tests -Filter '*.test.cjs' | ForEach-Object { $_.FullName })
          node --test @testFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Panel syntax
        shell: pwsh
        run: |
          Get-ChildItem extension/js,extension/dev -Filter '*.js' -Recurse | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Extension conventions
        shell: pwsh
        run: ./tools/lint.ps1
